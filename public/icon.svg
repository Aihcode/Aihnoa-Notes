<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#techBg)"/>
  
  <!-- Tech Circuit Grid Lines -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="2">
    <path d="M40 140 H200 L240 180 H472" />
    <path d="M40 372 H272 L312 332 H472" />
    <circle cx="200" cy="140" r="5" fill="#38BDF8" />
    <circle cx="272" cy="372" r="5" fill="#38BDF8" />
  </g>

  <!-- Note Sheet with Tech Cut Corner -->
  <g filter="url(#dropShadow)">
    <path d="M140 115 C140 98 154 84 172 84 L310 84 L382 156 L382 396 C382 413 368 428 350 428 L172 428 C154 428 140 413 140 396 Z" fill="url(#glowGrad)"/>
    <!-- Folded corner with tech blue tint -->
    <path d="M310 84 L310 148 C310 152.4 313.6 156 318 156 L382 156 Z" fill="#93C5FD"/>
  </g>

  <!-- Tech Note Holographic Header & Lines -->
  <rect x="180" y="152" width="105" height="16" rx="8" fill="url(#cyberBlue)"/>
  <rect x="180" y="192" width="150" height="12" rx="6" fill="#64748B" opacity="0.5"/>
  <rect x="180" y="218" width="130" height="12" rx="6" fill="#64748B" opacity="0.5"/>
  <rect x="180" y="244" width="140" height="12" rx="6" fill="#64748B" opacity="0.5"/>

  <!-- E2EE Shield & Core Tech Lock -->
  <g transform="translate(236, 252)" filter="url(#dropShadow)">
    <circle cx="72" cy="72" r="64" fill="#0B1120" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="72" cy="72" r="54" fill="url(#neonGlow)"/>
    <!-- Lock Icon & Quantum Keyhole -->
    <path d="M72 46 C65 46 59 52 59 59 L59 67 L55 67 C52.5 67 50.5 69 50.5 71.5 L50.5 93.5 C50.5 96 52.5 98 55 98 L89 98 C91.5 98 93.5 96 93.5 93.5 L93.5 71.5 C93.5 69 91.5 67 89 67 L85 67 L85 59 C85 52 79 46 72 46 Z M72 52.5 C75.5 52.5 78.5 55.5 78.5 59 L78.5 67 L65.5 67 L65.5 59 C65.5 55.5 68.5 52.5 72 52.5 Z" fill="#0B1120"/>
    <circle cx="72" cy="80.5" r="4" fill="#00F0FF" filter="url(#cyberGlow)"/>
  </g>
</svg>
